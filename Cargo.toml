[package]
name = "trippin"
version = "0.4.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
rfd = "0.17.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "=0.6.0", default-features = false, features = ["mp3", "flac", "wav", "vorbis", "aac", "alac", "ogg", "isomp4", "pcm"] }
ureq = { version = "3.4.2", features = ["json"] }
wgpu = "30.0.1"
winit = "0.30.13"

[build-dependencies]
# Embeds logo.ico as the exe's icon resource on Windows.
embed-resource = "3.0.6"

[features]
# No console window (used for the installer build).
gui = []

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
