[package]
name = "trippin"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wgpu = "30.0.1"
winit = "0.30.13"

[features]
# No console window (used for the installer build).
gui = []
