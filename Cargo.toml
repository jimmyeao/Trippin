[package]
name = "trippin"
version = "0.8.1"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libloading = "0.8.9"
pollster = "1.0.1"
rfd = "0.17.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "=0.6.0", default-features = false, features = ["mp3", "flac", "wav", "vorbis", "aac", "alac", "ogg", "isomp4", "pcm"] }
ureq = { version = "3.4.2", features = ["json", "platform-verifier"] }
wgpu = "30.0.1"
winit = "0.30.13"
# Now-playing: rekordbox master.db (SQLCipher) + Mixxx library, pure Rust crypto.
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
midir = "0.11.0"
beat-this = "1.0.0"
memmap2 = "0.9.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
# Embeds logo.ico as the exe's icon resource on Windows.
embed-resource = "3.0.6"

[features]
# No console window (used for the installer build).
gui = []

[target.'cfg(windows)'.dependencies]
# Now-playing from the OS media session (Spotify etc.).
# Spout output: D3D11 shared texture + the Spout shared-memory registry.
windows = { version = "0.62", features = [
    "Media_Control",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
