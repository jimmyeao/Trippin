# Builds the Windows installer.
# - Every push to master and every PR: build + installer, uploaded as a workflow artifact.
# - Pushing a tag like v0.2.0: also publishes a GitHub release with the installer attached.
# - Manual release (Actions > Build installer > Run workflow > version):
#   bumps Cargo.toml/Cargo.lock, pushes the commit and a v<version> tag, builds,
#   and publishes the release — all in one run. (A tag pushed by GITHUB_TOKEN
#   can't trigger a second workflow run, so the release happens here.)
name: Build installer

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release, e.g. 0.2.0 (blank = build only)"
        required: false
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Bump version, commit and tag (manual release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        shell: pwsh
        run: |
          $v = "${{ inputs.release_version }}".TrimStart('v')
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"$v`"" |
            Set-Content Cargo.toml -NoNewline
          cargo metadata --format-version 1 --quiet | Out-Null   # refresh the version in Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release v$v [skip ci]"
          git tag "v$v"
          git push origin HEAD:master
          git push origin "v$v"

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ("${{ inputs.release_version }}" -ne "") {
            $v = "${{ inputs.release_version }}".TrimStart('v')
          } else {
            $base = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
            $v = "$base-build.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version: $v"

      - name: Build (release, no console window)
        run: cargo build --release --locked --features gui

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\trippin.iss
          Get-ChildItem dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trippin-Setup-${{ steps.version.outputs.version }}
          path: dist/*.exe

      - name: Publish release (tags and manual releases)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    # Secrets can't be referenced in step-level `if:` — evaluate them here
    # once. Missing secrets leave the build running but unsigned.
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      # A "Developer ID Installer" certificate (separate from the app's
      # "Developer ID Application" one) signs the .pkg. Without it the
      # package is still built, unsigned (Gatekeeper then needs "Open
      # Anyway"); the app inside stays signed and notarized either way.
      HAS_INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERTIFICATE != '' && secrets.APPLE_INSTALLER_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            v="${{ inputs.release_version }}"
            v="${v#v}"
          else
            base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
            v="$base-build.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Build both architectures
        run: |
          cargo build --release --locked --features gui --target aarch64-apple-darwin
          cargo build --release --locked --features gui --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/trippin \
            target/x86_64-apple-darwin/release/trippin \
            -output target/release/trippin
          lipo -info target/release/trippin

      - name: Bundle Trippin.app
        run: |
          APP="Trippin.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp target/release/trippin "$APP/MacOS/trippin"
          cp -R shaders "$APP/Resources/shaders"
          cp -R dancers "$APP/Resources/dancers"

          mkdir -p trippin.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s logo.png --out "trippin.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) logo.png --out "trippin.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns trippin.iconset -o "$APP/Resources/trippin.icns"

          cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Trippin</string>
            <key>CFBundleIdentifier</key><string>com.deviousweb.trippin</string>
            <key>CFBundleVersion</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleExecutable</key><string>trippin</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>trippin.icns</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSMicrophoneUsageDescription</key><string>Trippin listens to audio input to drive music-reactive visuals.</string>
            <key>NSScreenCaptureUsageDescription</key><string>Trippin captures the system audio mix (not the screen) to drive music-reactive visuals.</string>
          </dict>
          </plist>
          EOF

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm certificate.p12
          security find-identity -v -p codesigning build.keychain

      - name: Sign Trippin.app (hardened runtime)
        if: env.HAS_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements installer/macos/Entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" Trippin.app
          codesign --verify --strict --verbose=2 Trippin.app

      - name: Notarize and staple
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent Trippin.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple Trippin.app
          xcrun stapler validate Trippin.app
          rm notarize.zip

      - name: Zip Trippin.app
        run: ditto -c -k --keepParent Trippin.app "Trippin-macOS-${{ steps.version.outputs.version }}.zip"

      - name: Import installer signing certificate
        if: env.HAS_INSTALLER_CERT == 'true'
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          if ! security list-keychains | grep -q build.keychain; then
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
          fi
          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > installer.p12
          security import installer.p12 -k build.keychain \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm installer.p12
          # G2 Developer ID certs only validate with Apple's G2 intermediate
          # in the chain; runners don't reliably carry it (nor did the
          # owner's Mac: CSSMERR_TP_NOT_TRUSTED until it was added).
          curl -fsSL -o DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k build.keychain || true
          rm DeveloperIDG2CA.cer
          security find-identity -v build.keychain

      # The installer: always to /Applications (not relocatable, so it never
      # "upgrades" a stray copy in Downloads instead), preinstall quits
      # Trippin and removes the old bundle so upgrades are clean.
      - name: Build installer package
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p pkgroot
          ditto Trippin.app pkgroot/Trippin.app
          chmod 755 installer/macos/scripts/preinstall
          pkgbuild --analyze --root pkgroot component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist
          plutil -replace 0.BundleOverwriteAction -string upgrade component.plist
          pkgbuild --root pkgroot --component-plist component.plist \
            --identifier com.deviousweb.trippin --version "$V" \
            --install-location /Applications \
            --scripts installer/macos/scripts \
            Trippin-component.pkg
          sed "s/__VERSION__/$V/" installer/macos/distribution.xml > distribution.xml
          if [ "$HAS_INSTALLER_CERT" = "true" ]; then
            productbuild --distribution distribution.xml --package-path . \
              --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" --timestamp \
              "Trippin-macOS-$V.pkg"
            pkgutil --check-signature "Trippin-macOS-$V.pkg"
          else
            productbuild --distribution distribution.xml --package-path . \
              "Trippin-macOS-$V.pkg"
          fi
          rm Trippin-component.pkg
          pkgutil --payload-files "Trippin-macOS-$V.pkg" | sed -n "1,5p"

      - name: Notarize and staple installer
        if: env.HAS_INSTALLER_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          P="Trippin-macOS-${{ steps.version.outputs.version }}.pkg"
          xcrun notarytool submit "$P" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$P"
          xcrun stapler validate "$P"

      - name: Remove signing keychain
        if: ${{ always() && env.HAS_CERT == 'true' }}
        run: security delete-keychain build.keychain || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trippin-macOS-${{ steps.version.outputs.version }}
          path: |
            Trippin-macOS-*.pkg
            Trippin-macOS-*.zip

      - name: Publish release (tags and manual releases)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Trippin-macOS-*.pkg
            Trippin-macOS-*.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: false
