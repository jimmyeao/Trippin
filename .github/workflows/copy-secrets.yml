# TEMPORARY: one-shot copy of this repo's Apple secrets into the Bookmarks
# repo. Run once (Actions > Copy secrets to bookmarks repo > Run workflow,
# or `gh workflow run copy-secrets.yml --ref <branch>`), then delete this
# file and the SECRETS_SYNC_PAT secret.
#
# GITHUB_TOKEN is scoped to Trippin, so writing secrets on the target repo
# needs a PAT: either add a classic PAT (repo scope) as the SECRETS_SYNC_PAT
# repo secret, or paste one into the `token` input at run time. Secret
# values are piped into `gh secret set` without being echoed — only the
# names are logged.
name: Copy secrets to bookmarks repo

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target repo (owner/name)"
        required: true
        default: "jimmyeao/Google-Bookmarks-Manager-for-GPOs"
      token:
        description: "PAT for the target repo (only needed if the SECRETS_SYNC_PAT secret isn't set)"
        required: false

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_SYNC_PAT || inputs.token }}
          TARGET: ${{ inputs.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -e
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      APPLE_INSTALLER_CERTIFICATE APPLE_INSTALLER_CERTIFICATE_PASSWORD \
                      APPLE_INSTALLER_SIGNING_IDENTITY; do
            val="${!name}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | gh secret set "$name" -R "$TARGET"
              echo "copied $name"
            else
              echo "skipped $name (not set in Trippin)"
            fi
          done
