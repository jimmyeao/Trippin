# trippin.club — static site (behind Cloudflare, Full strict)
server {
    listen 80;
    server_name trippin.club www.trippin.club;
    location / { return 301 https://trippin.club$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.trippin.club;
    ssl_certificate /etc/letsencrypt/live/trippin.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trippin.club/privkey.pem;
    return 301 https://trippin.club$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trippin.club;

    ssl_certificate /etc/letsencrypt/live/trippin.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trippin.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'self'; frame-ancestors 'self';" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    root /var/www/trippin.club;
    index index.html;

    location ~* \.(jpg|png|gif|webp|mp4|css|js)$ { expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
